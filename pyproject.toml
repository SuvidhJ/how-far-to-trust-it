[project]
name = "support-agent"
version = "0.1.0"
description = "Intent classification, grounded reply drafting and escalation routing for a single brand's Twitter customer support."
readme = "README.md"
license = "MIT"
authors = [{ name = "Suvidh Jain" }]
keywords = ["customer-support", "llm", "evaluation", "intent-classification", "rag", "llm-as-judge"]
requires-python = ">=3.12,<3.13"

# Kept deliberately small: the README promises a reproducible headline result
# in under 15 minutes, and that budget includes `uv sync`.
dependencies = [
    "duckdb>=1.1",           # query the 493MB raw CSV without loading it
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",     # TF-IDF + linear baselines, metrics, splits
    "scipy>=1.13",
    "openai>=1.50",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "langid>=1.1.6",
]

[project.urls]
Repository = "https://github.com/SuvidhJ/how-far-to-trust-it"
Demo = "https://suvidhj.github.io/how-far-to-trust-it/"

[project.optional-dependencies]
# Only needed if we do local embeddings instead of an embedding API.
# Pulls torch (~200MB), so it is NOT part of the reproduce path.
local-embed = ["sentence-transformers>=3.0"]

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8.3", "pytest-cov>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]   # formatter owns line length

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --no-header -p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
# Project lives on E:, uv cache on C:. Hardlinking across drives fails on
# Windows, so copy instead. Without this, every sync emits warnings.
link-mode = "copy"
